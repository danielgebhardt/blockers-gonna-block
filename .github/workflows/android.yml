name: Build APK + IPA + web app

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test (rules, solver, every shipped level)
        run: npm test

      - name: Build web app
        run: npm run build

      # The same build is the installable web app (GitHub Pages), see the pages job.
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

      # Everything below only on main: that's what produces the installable APK.
      - uses: actions/setup-java@v4
        if: github.ref == 'refs/heads/main'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: github.ref == 'refs/heads/main'

      - name: Capacitor sync
        if: github.ref == 'refs/heads/main'
        run: npx cap sync android

      - name: Assemble debug APK
        if: github.ref == 'refs/heads/main'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../blockers-gonna-block.apk

      - name: Publish "latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true
          gh release create latest blockers-gonna-block.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build (#${GITHUB_RUN_NUMBER})" \
            --notes "Debug build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Install over the previous build to keep your progress.

          Android: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/blockers-gonna-block.apk
          Web app (iPhone/iPad: open in Safari, Share, Add to Home Screen): https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/
          iOS (unsigned, for sideloading; attached a few minutes later): https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/blockers-gonna-block.ipa"

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: blockers-gonna-block-${{ github.run_number }}
          path: blockers-gonna-block.apk

  # Web app on GitHub Pages: iPhone/iPad "Add to Home Screen", no signing or expiry.
  pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4

  # Unsigned iOS build, for sideloading with a free Apple ID (AltStore / SideStore
  # re-sign it on install). Built on every push as a check; published from main.
  ios:
    needs: build
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Web build, icons, Capacitor sync
        run: npm run ios

      - name: Build unsigned .ipa
        working-directory: ios/App
        run: |
          xcodebuild -version
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -quiet build
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../blockers-gonna-block.ipa Payload
          ls -l ../../blockers-gonna-block.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: blockers-gonna-block-ios-${{ github.run_number }}
          path: blockers-gonna-block.ipa

      - name: Attach .ipa to the "latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest blockers-gonna-block.ipa --clobber --repo "$GITHUB_REPOSITORY"
